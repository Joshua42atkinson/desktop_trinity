[package]
name = "trinity-brain"
version.workspace = true
edition.workspace = true
description = "Desktop node binary - LLM inference server for Trinity Genesis"

[[bin]]
name = "trinity-brain"
path = "src/main.rs"

[features]
default = ["rocm"]
rocm = ["trinity-kernel/rocm", "trinity-kernel/desktop"]

[dependencies]
# Internal crates
trinity-kernel = { workspace = true, features = ["desktop", "inference"] }
trinity-protocol = { workspace = true }
trinity-skills = { workspace = true }

# Async Runtime
tokio = { workspace = true }
futures = { workspace = true }
tokio-util = { workspace = true }
tokio-serde = { workspace = true }

# RPC
tarpc = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utils
uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
