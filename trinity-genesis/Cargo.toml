[workspace]
members = [
    "crates/trinity-kernel",
    "crates/trinity-protocol",
    "crates/trinity-brain",
    "crates/trinity-body",
    "crates/trinity-skills",
    "crates/trinity-coder",
    "crates/trinity-cli",
    "crates/trinity-client",
    "crates/iron-road-physics",
]
exclude = [
    "quadradical-tools/calculator",  # WASM plugins compiled separately
    "quadradical-tools/code_editor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Joshua <joshua@trinity-ai.com>"]
description = "Trinity AI Agent System - The backbone of the Ask_Pete Initiative"
license = "GPL-3.0"
repository = "https://github.com/joshua42/trinity-genesis"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-serde = "0.8"

# ECS & Game Engine
bevy = { version = "0.14", default-features = true }
bevy_egui = "0.28"

# RPC Communication
tarpc = { version = "0.35", features = [
    "tokio1",
    "serde-transport",
    "serde-transport-bincode",
] }
bincode = "1.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# AI / Inference
# llama-cpp-2 defined in individual crates with features
candle-core = { version = "0.9.2-alpha.2" }
candle-nn = { version = "0.9.2-alpha.2" }
candle-transformers = { version = "0.9.2-alpha.2" }

# Vector Database (future - use sled for now)
# lancedb = "0.3"

# Utils
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
dashmap = "5"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json", "blocking"] }
scraper = "0.18"
dirs = "5"

# Internal crates
trinity-kernel = { path = "crates/trinity-kernel" }
trinity-protocol = { path = "crates/trinity-protocol" }
trinity-skills = { path = "crates/trinity-skills" }

# Patch crates.io llama-cpp-2 with our HIP-enabled version
# This is required for GPU offloading on AMD Strix Halo
[patch.crates-io]
llama-cpp-2 = { path = "../patches/llama-cpp-2" }
llama-cpp-sys-2 = { path = "../patches/llama-cpp-sys-2" }
