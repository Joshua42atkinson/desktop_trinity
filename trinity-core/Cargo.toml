[package]
name = "trinity-core"
version = "0.1.0"
edition = "2021"
description = "Rust-native AI agent runtime for AMD Strix Halo - The Digital Familiar"
license = "GPL-3.0"
authors = ["Joshua Atkinson"]
repository = "https://github.com/joshua42atkinson/trinity"

[dependencies]
# App Framework & ECS
bevy = { workspace = true }

# Bevy async (optional - conflicts with candle due to rand versions)
bevy_defer = { version = "0.14", optional = true }

# Media & Physics (optional for memory-only builds)
image = { version = "0.25", optional = true }
rodio = { version = "0.19", optional = true }
bevy_rapier3d = { version = "0.27", optional = true }

# Async runtime
tokio = { version = "1", default-features = false, features = [
    "sync",
    "macros",
    "rt",
] }
futures = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Logging / Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Memory management
dashmap = { workspace = true }
lru = "0.12"

# Vector DB & Persistence
sled = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }

# File paths
directories = { workspace = true, optional = true }

# Utils
uuid = { workspace = true, features = ["js"] }
chrono = { workspace = true }

# Configuration
toml = "0.8"
dirs = "5"

# Google Integration
google-drive3 = "5.0"
yup-oauth2 = "8.3"
hyper = { version = "0.14", features = ["full"] }
hyper-rustls = "0.24"

# System Info (for device capability detection)
sysinfo = "0.33"

reqwest = { version = "0.12", default-features = false, features = [
    "json",
], optional = true }

# Async Traits
async-trait = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Regex for parsing
regex = "1"

# ONNX Runtime for embeddings (disabled - all versions yanked as of Dec 2024)
# ort = { version = "2.0.0-rc.10", optional = true }
ndarray = { version = "0.15", optional = true }

# Fast semantic embeddings (all-MiniLM-L6-v2 bundled)
fastembed = { version = "4", optional = true }

# llama.cpp Rust bindings with ROCm support  
# Note: hip feature requires our patched llama-cpp-sys-2 (see workspace Cargo.toml [patch])
llama-cpp-2 = { version = "0.1", optional = true }

# Voice Stack (Desktop)
whisper-rs = { version = "0.13", optional = true }
cpal = { version = "0.15", optional = true }
ringbuf = { version = "0.4", optional = true }

# Web Support
web-sys = { version = "0.3", features = [
    "Window",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
walkdir = "2.5.0"

# Dev/Test
[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[features]
default = ["desktop"]

desktop = [
    "tokio/full",
    "dep:llama-cpp-2",
    "dep:rodio",
    "dep:cpal",
    "dep:ringbuf",
    "dep:sled",
    "dep:rusqlite",
    "dep:directories",
    "dep:reqwest",
    "media",
    "memory",
    # "embeddings", # TODO: Enable when ort stabilizes
]

voice_whisper = ["dep:whisper-rs"]

web = [
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:gloo-timers",
]

# Memory system only
memory = ["dep:sled", "dep:rusqlite"]

# Embeddings for semantic search (ONNX disabled until ort stabilizes)
embeddings = ["dep:ndarray"]

# Semantic embeddings via fastembed
semantic = ["dep:fastembed"]

# Full media/game features
media = ["dep:image", "dep:rodio", "dep:bevy_rapier3d"]

# Bevy async
async = ["dep:bevy_defer"]

# llama.cpp backend for GGUF inference
llama-cpp = ["dep:llama-cpp-2"]

# HIP/ROCm backend for AMD GPUs
hip = ["dep:llama-cpp-2", "llama-cpp-2/hip"]

cpu = []

[[bin]]
name = "trinity-hw"
path = "src/bin/trinity_hw.rs"
required-features = ["desktop"]

[[example]]
name = "verify_load"
path = "examples/verify_load.rs"
required-features = ["desktop", "hip"]

[[example]]
name = "verify_self_coder"
path = "examples/verify_self_coder.rs"
required-features = ["desktop", "hip"]
