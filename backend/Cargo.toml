[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[features]
default = []
hip = ["trinity-core/hip"]

[dependencies]
# This backend depends on the shared data structures
common = { path = "../common", features = ["ssr"] }
frontend = { path = "../frontend" }

# Trinity Core (memory features)
trinity-core = { path = "../trinity-core", default-features = false, features = [
    "memory",
    "desktop",
] }

# Web Server framework
axum = "0.8"
tower-http = { version = "0.5", features = ["cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
anyhow = "1.0"
async-trait = "0.1"

# Leptos SSR
leptos = { version = "0.8.0-rc3", features = ["ssr"] }
leptos_axum = "0.8.0-rc3"

# State Management
bevy = { version = "0.14", features = ["bevy_winit", "bevy_render"] }
bevy_ecs = { version = "0.14" }
bevy_defer = "0.14"
bevy_yarnspinner = "0.3.0"
bevy_egui = "0.28"

# Database
sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
] }
dotenvy = "0.15"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# AI/LLM - Candle 0.9.2-alpha with rand 0.9 support
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }

# Caching and concurrency
lru = "0.12"
dashmap = "5"

# Logging
log = "0.4"

# Static Asset Embedding
rust-embed = "8.5"
mime_guess = "2.0"

# HTTP Client (for LM Studio API fallback)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Random number generation
rand = "0.8"

# YAML parsing for character files
serde_yaml = "0.9"

# Regex for tool call parsing
regex = "1.10"
dotenv = "0.15.0"

# Lightweight embedded SQL for task persistence
rusqlite = { version = "0.32", features = ["bundled"] }

# Home directory detection for permanent storage
dirs = "5"
