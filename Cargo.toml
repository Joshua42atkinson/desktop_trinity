# Trinity Workspace
# ==================
# This is a minimal root workspace that points to trinity-genesis.
# All legacy code has been archived to _archive/

[workspace]
members = []
exclude = [
    "trinity-genesis", # THE main workspace - build from there
    "_archive",        # Legacy code archive
    "_tools",          # External tools (piper TTS, etc)
]
resolver = "2"

# Keep shared dependencies for patches to work
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Patched crates for AMD GPU (HIP/ROCm) support
# These patches are used by trinity-genesis/crates/trinity-brain
[patch.crates-io]
llama-cpp-2 = { path = "patches/llama-cpp-2" }
llama-cpp-sys-2 = { path = "patches/llama-cpp-sys-2" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1
