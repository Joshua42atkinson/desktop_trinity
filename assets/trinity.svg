<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0b2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#bgGrad)" stroke="#333" stroke-width="4"/>
  
  <!-- Triquetra / Trinity Knot Symbolism -->
  <g transform="translate(256, 270) scale(0.8)" filter="url(#glow)">
    <!-- Interlocking Arcs representing Trinity -->
    <path d="M 0 -180 C 100 -180, 180 -50, 90 110 C 0 200, -90 110, -180 -50 C -100 -180, 0 -180, 0 -180 Z" 
          fill="none" stroke="#00FFFF" stroke-width="25" stroke-linecap="round" opacity="0.9" />
          
    <path d="M 0 -180 C -100 -180, -180 -50, -90 110 C 0 200, 90 110, 180 -50 C 100 -180, 0 -180, 0 -180 Z" 
          fill="none" stroke="#9400D3" stroke-width="20" stroke-linecap="round" opacity="0.7" />
          
    <!-- Central Core -->
    <circle cx="0" cy="20" r="50" fill="url(#goldGrad)" />
    <circle cx="0" cy="20" r="65" fill="none" stroke="#FFD700" stroke-width="4" stroke-dasharray="10, 10" />
  </g>
  
  <!-- Code Nodes -->
  <circle cx="100" cy="100" r="10" fill="#00FFFF" opacity="0.6"/>
  <circle cx="412" cy="100" r="10" fill="#00FFFF" opacity="0.6"/>
  <circle cx="256" cy="450" r="10" fill="#00FFFF" opacity="0.6"/>
  
  <!-- Connecting Lines -->
  <line x1="100" y1="100" x2="160" y2="160" stroke="#00FFFF" stroke-width="2" opacity="0.3"/>
  <line x1="412" y1="100" x2="352" y2="160" stroke="#00FFFF" stroke-width="2" opacity="0.3"/>
  <line x1="256" y1="450" x2="256" y2="380" stroke="#00FFFF" stroke-width="2" opacity="0.3"/>

</svg>
