[package]
name = "trinity-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
# Bevy Game Engine (UI & App Runtime)
bevy = { workspace = true }
bevy_egui = { workspace = true }

# Trinity Core (Kernel & Logic)
trinity-core = { path = "../trinity-core", features = ["desktop", "hip"] }

# Async Runtime
tokio = { workspace = true }

# Time handling
chrono = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
